services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
      build: 
        context: ./frontend
        target: dev  # <--- Change this to 'dev' or 'prod'
      volumes:
        - ./frontend:/app
        - /app/node_modules
      ports:
        - "5173:5173"
      depends_on:
        - api

volumes:
  postgres_data: